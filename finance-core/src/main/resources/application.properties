spring.application.name=finance-core

spring.datasource.url=${FIDB_URL}
spring.datasource.username=${FIDB_USERNAME}
spring.datasource.password=${FIDB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${FIJWT_SECRET}
app.jwt.ttl-seconds=3600

app.cookie.secure=${COOKIE_SECURE:false}

spring.mvc.problemdetails.enabled=true

logging.file.name=logs/finance-core.log
logging.structured.format.file=ecs
logging.structured.ecs.service.name=finance-core